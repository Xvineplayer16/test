<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wii UI Clone</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="script.js"></script>
</head>
<body>
    <div class="menu-container">
        <div class="grid">
            <div class="menu-item" id="wii-menu">
                <div class="icon">💿</div>
                <p>Wii U Menu</p>
            </div>
            <div class="menu-item yellow" id="transfer">
                <div class="icon">📤</div>
                <p>Wii System Transfer</p>
            </div>
            <div class="menu-item blue" id="shop">
                <div class="icon">🛍️</div>
                <p>Wii Shop Channel</p>
            </div>
            <div class="menu-item pink" id="mii-channel">
                <div class="icon">👥</div>
                <p>Mii Channel</p>
            </div>
        </div>
        <div class="time-display">
            <span id="time">14:13</span>
            <span id="date">Sun 23/10</span>
        </div>
        <button class="next-btn">Next →</button>
    </div>
</body>
</html>
